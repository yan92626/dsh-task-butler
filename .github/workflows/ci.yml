name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Static checks (packaging, palette, client contract)
        run: node tests/static-check.mjs
      - name: Host unit tests (work log, morning brief, retrospective and store API)
        run: node --test tests/logs-unit.mjs tests/evolution-unit.mjs tests/briefs-unit.mjs
